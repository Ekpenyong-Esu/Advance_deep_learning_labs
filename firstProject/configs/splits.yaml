# configs/splits.yaml
# --------------------
# Dataset split configuration for the Nordic Vehicle Dataset (NVD).
#
# ── LAYOUT NOTE ─────────────────────────────────────────────────────────────
# NVD ships in a FLAT layout.  All images share one directory and all labels
# share one directory; the train/val/test splits are defined by .txt file lists:
#
#   data/raw/images/     ← every frame from every recording lives here
#   data/raw/labels/     ← one .txt per frame (YOLO format)
#   data/raw/train.txt   ← 4 355 frame paths
#   data/raw/val.txt     ← 2 904 frame paths
#   data/raw/test.txt    ← 1 191 frame paths
#
# The primary training config is  configs/data.yaml  (used by ultralytics).
# For programmatic loading use  load_yolo_split_from_txt()  — not
# load_splits_from_config() — because the flat layout means all three splits
# share the same images/ and labels/ directories.
#
# Example:
#   from data_utils import load_yolo_split_from_txt
#   train = load_yolo_split_from_txt(
#       'data/raw/train.txt', root='data/raw',
#       split_name='train', class_names=['car'])
#
# ── RECORDINGS (verified 2026-04-18) ────────────────────────────────────────
# Train + Val recordings  (same 4 recordings; different frames per split):
#   2022-12-02 Asjo 01_stabilized
#   2022-12-03 Nyland 01_stabilized
#   2022-12-04 Bjenberg 02
#   2022-12-23 Asjo 01_HD 5x stab
#
# Test recording  (held out entirely — different location):
#   2022-12-23 Bjenberg 02_stabilized
#
# Frame counts: train=4355 | val=2904 | test=1191 | total=8450
#
# ── CLASS NAMES (verified 2026-04-18) ───────────────────────────────────────
# All 8450 label files contain only class_id=0.  nc: 1.

class_names:
  - car   # class_id 0 — only class present in NVD

# ── SPLIT PATHS (flat layout — all splits share the same image/label dirs) ──
# These entries are kept for compatibility with load_splits_from_config().
# WARNING: load_splits_from_config() will load ALL images for every split
# because images/ is shared.  Use load_yolo_split_from_txt() instead.

splits:
  train:
    - images: data/raw/images/
      labels: data/raw/labels/

  val:
    - images: data/raw/images/
      labels: data/raw/labels/

  test:
    - images: data/raw/images/
      labels: data/raw/labels/

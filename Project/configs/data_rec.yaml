# configs/data_rec.yaml
# ----------------------
# Recording-level split variant of data.yaml.
#
# KEY DIFFERENCE FROM data.yaml
# -------------------------------
# data.yaml splits train and val frame-by-frame within the same 4 recordings.
# This causes temporal leakage: val mAP is inflated because the model has
# seen visually identical frames (consecutive video frames) during training.
#
# This file uses recording-level splits generated by:
#   python scripts/make_recording_splits.py
#
# Split composition:
#   Train  : Bjenberg 02 + Asjo 01_stabilized + Asjo 01_HD 5x stab  (6056 frames)
#   Val    : Nyland 01_stabilized  (1203 frames, geographically distinct location)
#   Test   : Bjenberg 02_stabilized  (1191 frames — unchanged)
#
# Using this split gives a more honest val mAP and a narrower val→test gap,
# because val now comes from a recording the model has never seen.
#
# To use:
#   DATA_YAML = str(ROOT / "configs" / "data_rec.yaml")
#   (replace the data.yaml reference in the notebook's shared config cell)

path: ../data/raw          # relative to this configs/ directory
train: train_rec.txt       # recording-level train split (6056 frames, 3 recordings)
val:   val_rec.txt         # recording-level val split   (1203 frames, Nyland only)
test:  test.txt            # unchanged test split        (1191 frames, Bjenberg 02_stabilized)

nc: 1
names:
  0: car
